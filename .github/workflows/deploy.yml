name: Terraform Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write # Required for Google Workload Identity Federation OIDC auth

env:
  TF_VERSION: "1.7.0"
  # Replace these with your actual GCP project ID and region or set them as GitHub variables
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: "europe-north1"

jobs:
  terraform:
    name: "Terraform CD"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      #  GCP Authentication
      #  We support both modern OIDC (Workload Identity Federation)
      #  and standard Service Account JSON Key fallbacks.
      # -------------------------------------------------------------
      - name: Authenticate to Google Cloud (OIDC Preferred)
        id: auth-oidc
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          # If using OIDC (Workload Identity Federation), set these secrets
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud (SA Key Fallback)
        if: steps.auth-oidc.outcome == 'failure' || !secrets.GCP_WORKLOAD_IDENTITY_PROVIDER
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # -------------------------------------------------------------
      #  Terraform Setup & Validation
      # -------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          # If you have GCS backend configured, this will initialize it.
          # If not, it will fall back to local (though a remote backend is highly recommended in CI).
          terraform init

      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------------------
      #  Terraform Plan / Apply
      # -------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        run: |
          # Generate variables file dynamically or inject via env
          terraform plan -var="project_id=${{ env.GCP_PROJECT_ID }}" -no-color -out=tfplan
        
      - name: Terraform Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          terraform apply -var="project_id=${{ env.GCP_PROJECT_ID }}" -auto-approve
